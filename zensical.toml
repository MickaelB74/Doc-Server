# =============================================================================
# Configuration Zensical — Documentation du serveur
# Référence : https://zensical.org/docs/setup/basics/
# =============================================================================

[project]
# URL publique du site, attribuée par Render au service static site.
# À modifier si un domaine personnalisé est branché.
site_url = "https://doc-server-pl8t.onrender.com/"
site_name = "Documentation serveur"
# site_description = "Description du serveur"
# site_author = "Votre nom"

# copyright = "Copyright &copy; 2026 Votre nom"

# Dépôt Git : à renseigner quand le remote sera branché (affiche un lien "Voir
# la source" et permet les boutons d'édition avec les features content.action.*).
# repo_url = "https://github.com/organisation/doc-serveur"
# repo_name = "organisation/doc-serveur"
# edit_uri = "edit/main/docs/"

# Dossiers source / sortie (valeurs par défaut, explicitées pour Render qui
# publie le dossier "site").
docs_dir = "docs"
site_dir = "site"

# Navigation : ajouter une entrée par page / section au fil de la rédaction.
nav = [
  { "Accueil" = "index.md" },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "assets/favicon.png"
language = "fr"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/server"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

# Palette : suit la préférence système, avec bascule clair / sombre.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Passer en mode clair"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Passer en mode sombre"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Suivre la préférence système"

# Extensions Markdown (reprises du gabarit officiel `zensical new`).
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
