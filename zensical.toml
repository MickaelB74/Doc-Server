# =============================================================================
# Configuration Zensical — Documentation du serveur MyCivilisation (Valmont)
# Référence : https://zensical.org/docs/setup/basics/
# =============================================================================

[project]
# URL publique du site, attribuée par Render au service static site.
# À modifier si un domaine personnalisé est branché.
site_url = "https://doc-server-pl8t.onrender.com/"
site_name = "MyCivilisation · Valmont"
site_description = "Guide du joueur du serveur Minecraft médiéval et coopératif MyCivilisation : rebâtir ensemble la cité de Valmont."
# site_author = "Votre nom"

# Mention exigée par les conditions d'utilisation de la marque Minecraft.
copyright = "MyCivilisation · Valmont — Serveur Minecraft non officiel, ni approuvé ni associé à Mojang ou Microsoft."

# Dépôt Git : à renseigner quand le remote sera branché (affiche un lien "Voir
# la source" et permet les boutons d'édition avec les features content.action.*).
# repo_url = "https://github.com/organisation/doc-serveur"
# repo_name = "organisation/doc-serveur"
# edit_uri = "edit/main/docs/"

# Dossiers source / sortie (valeurs par défaut, explicitées pour Render qui
# publie le dossier "site").
docs_dir = "docs"
site_dir = "site"

# Navigation : un onglet par grande rubrique (feature navigation.tabs). La
# première page de chaque rubrique est son index (feature navigation.indexes).
nav = [
  { "Accueil" = "index.md" },
  { "Le serveur" = [
    "serveur/index.md",
    { "Installer le modpack" = "serveur/modpack.md" },
    { "Mods et plugins" = "serveur/mods-et-plugins.md" },
    { "Liste des mods" = "serveur/liste-des-mods.md" },
    { "Les règles d'or" = "serveur/regles.md" },
  ] },
  { "L'histoire" = [
    "histoire/index.md",
    { "Les Chroniques de Valmont" = "histoire/chroniques.md" },
    { "Lieux et lexique" = "histoire/lexique.md" },
  ] },
  { "Guide du joueur" = [
    "guide/index.md",
    { "La trame principale" = "guide/trame.md" },
    { "La ville" = [
      { "Le territoire" = "guide/territoire.md" },
